<!DOCTYPE html>
<html>
<head>
<title>Sign Up</title>
<style>
body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: Arial; text-align: center; color: white; }
.box { background: rgba(255,255,255,0.2); width: 500px; margin: 50px auto; padding: 30px; border-radius: 30px; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
h1 { font-size: 40px; }
input, select { width: 90%; padding: 15px; margin: 10px; border-radius: 25px; border: 2px solid #ccc; font-size: 16px; }
button { background: #ff6b6b; color: white; padding: 15px 50px; border: none; border-radius: 50px; font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
<h1>🍽️ Welcome to Plated! 🎉</h1>
<p>Join thousands of happy users and unlock your meal planning potential!</p>
<input type="text" placeholder="Full Name">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<select><option>Dietary preference</option><option>None</option><option>Vegetarian</option><option>Vegan</option><option>Keto</option><option>Gluten-free</option></select>
<select><option>Household size</option><option>1</option><option>2</option><option>3-4</option><option>5+</option></select>
<label><input type="checkbox" style="width:auto"> I agree to the terms</label><br><br>
<button>🚀 SIGN UP NOW!!!</button>
<p>Already have an account? <a href="#" style="color:yellow">Login</a></p>
</div>
</body>
</html>
